{% extends "base.html" %}
{% block content %}
<h2>Panel - {{ current_user.username }}</h2>

<form method="POST" action="{{ url_for('main.registrar_entrada') }}" style="display:inline-block;">
    <button type="submit">Registrar Entrada</button>
</form>

<form method="POST" action="{{ url_for('main.registrar_salida') }}" style="display:inline-block; margin-left:10px;">
    <button type="submit">Registrar Salida</button>
</form>

<h3>Historial</h3>
{% if registros %}
  <table border="1" cellpadding="6" cellspacing="0">
    <thead>
      <tr>
        <th>Tipo</th>
        <th>Fecha y Hora (UTC)</th>
      </tr>
    </thead>
    <tbody>
      {% for r in registros %}
      <tr>
        <td>{{ r.tipo }}</td>
        <td>{{ r.fecha_hora.strftime("%Y-%m-%d %H:%M:%S") }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
{% else %}
  <p>No hay registros aún.</p>
{% endif %}
{% endblock %}

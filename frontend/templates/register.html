{% extends "base.html" %}
{% block content %}
<h2>Registro</h2>
<form method="POST" action="{{ url_for('main.register_page') }}">
    <label>Usuario:</label><br>
    <input type="text" name="username" required><br>
    <label>Contraseña:</label><br>
    <input type="password" name="password" required><br><br>
    <button type="submit">Registrar</button>
</form>
<p>¿Ya tienes cuenta? <a href="{{ url_for('main.login_page') }}">Inicia sesión</a></p>
{% endblock %}
